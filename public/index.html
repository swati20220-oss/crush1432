<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Music Streamer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Layout */
    .container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 240px; background: #000; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar h2 { color: #1db954; font-size: 22px; margin-bottom: 12px; }
    .nav-btn { background: none; border: none; color: #b3b3b3; font-size: 15px; text-align: left; cursor: pointer; padding: 10px; border-radius: 6px; }
    .nav-btn:hover { color: #fff; background: #282828; }

    .main-content { flex: 1; padding: 24px; overflow-y: auto; background: linear-gradient(180deg, #202020 0%, #121212 100%); }
    .search-box { display: flex; gap: 10px; margin-bottom: 24px; }
    .search-box input { flex: 1; max-width: 450px; padding: 12px 18px; border-radius: 25px; border: none; outline: none; background: #2a2a2a; color: #fff; font-size: 15px; }
    .search-box button { padding: 12px 24px; border-radius: 25px; border: none; background: #1db954; color: #000; font-weight: bold; cursor: pointer; }
    .search-box button:hover { opacity: 0.9; }

    /* Cards Grid */
    .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 100px; }
    .track-card { background: #181818; padding: 14px; border-radius: 8px; cursor: pointer; transition: background 0.2s; position: relative; }
    .track-card:hover { background: #282828; }
    .track-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .track-title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .track-channel { font-size: 12px; color: #aaa; }
    .fav-btn { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; }

    /* Bottom Player */
    .player-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 1000; }
    .player-info { display: flex; align-items: center; gap: 14px; width: 35%; }
    .player-info img { width: 55px; height: 55px; border-radius: 6px; object-fit: cover; background: #333; }
    .player-text { overflow: hidden; }
    .player-title { font-size: 14px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .player-artist { font-size: 12px; color: #aaa; }

    .player-controls { display: flex; align-items: center; gap: 20px; }
    .play-btn { background: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; color: #000; }

    /* Hidden YouTube Player */
    #yt-player-container { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; pointer-events: none; }
  </style>
</head>
<body>

  <div id="yt-player-container">
    <div id="yt-player"></div>
  </div>

  <div class="container">
    <div class="sidebar">
      <h2>Spotify UI</h2>
      <button class="nav-btn" onclick="fetchSongs('Top Bollywood Songs')">🏠 Home</button>
      <button class="nav-btn" onclick="fetchSongs('Arijit Singh Hits')">🎤 Arijit Singh</button>
      <button class="nav-btn" onclick="fetchSongs('Sidhu Moose Wala Hits')">🔥 Punjabi Hits</button>
      <button class="nav-btn" onclick="fetchSongs('Lo-Fi Chill Beats')">🎧 Lo-Fi Beats</button>
      <button class="nav-btn" onclick="showFavorites()">❤️ Liked Songs</button>
    </div>

    <div class="main-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search any song or singer..." />
        <button onclick="handleSearch()">Search</button>
      </div>

      <h3 id="sectionTitle" style="margin-bottom: 20px;">Trending Tracks</h3>
      <div class="track-grid" id="trackGrid"></div>
    </div>
  </div>

  <div class="player-bar">
    <div class="player-info">
      <img id="currentThumb" src="https://via.placeholder.com/55" alt="" />
      <div class="player-text">
        <div class="player-title" id="currentTitle">Select a song to play</div>
        <div class="player-artist" id="currentChannel">-</div>
      </div>
    </div>

    <div class="player-controls">
      <button class="play-btn" id="masterPlayBtn" onclick="togglePlayPause()">▶</button>
    </div>

    <div style="width: 35%; text-align: right; font-size: 12px; color: #777;">
      Full Audio Stream
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer = null;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '200',
        width: '200',
        playerVars: { 'autoplay': 0, 'controls': 0 },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('masterPlayBtn').innerText = '⏸';
      } else {
        isPlaying = false;
        document.getElementById('masterPlayBtn').innerText = '▶';
      }
    }

    async function fetchSongs(query) {
      document.getElementById('sectionTitle').innerText = `Results for: ${query}`;
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (data.error) {
          alert('Error: ' + data.error);
          return;
        }

        if (data.items) {
          renderSongs(data.items);
        }
      } catch (err) {
        alert('Server se connect nahi ho paya!');
      }
    }

    function renderSongs(items) {
      const grid = document.getElementById('trackGrid');
      grid.innerHTML = '';

      items.forEach(item => {
        if (!item.id || !item.id.videoId) return;

        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const channel = item.snippet.channelTitle;
        const thumb = item.snippet.thumbnails.medium.url;

        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <button class="fav-btn" onclick="event.stopPropagation(); saveFavorite('${videoId}', '${title.replace(/'/g, "")}', '${channel.replace(/'/g, "")}', '${thumb}')">❤️</button>
          <img src="${thumb}" alt="${title}" />
          <div class="track-title">${title}</div>
          <div class="track-channel">${channel}</div>
        `;

        card.onclick = () => playSong(videoId, title, channel, thumb);
        grid.appendChild(card);
      });
    }

    function playSong(videoId, title, channel, thumb) {
      document.getElementById('currentTitle').innerText = title;
      document.getElementById('currentChannel').innerText = channel;
      document.getElementById('currentThumb').src = thumb;

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.playVideo();
      }
    }

    function togglePlayPause() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function saveFavorite(id, title, channel, thumb) {
      let favs = JSON.parse(localStorage.getItem('fav_songs') || '[]');
      const exists = favs.find(s => s.id && s.id.videoId === id);
      if (exists) {
        favs = favs.filter(s => s.id.videoId !== id);
        alert('Removed from Liked Songs');
      } else {
        favs.push({ id: { videoId: id }, snippet: { title, channelTitle: channel, thumbnails: { medium: { url: thumb } } } });
        alert('Saved to Liked Songs ❤️');
      }
      localStorage.setItem('fav_songs', JSON.stringify(favs));
    }

    function showFavorites() {
      document.getElementById('sectionTitle').innerText = '❤️ Liked Songs';
      const favs = JSON.parse(localStorage.getItem('fav_songs') || '[]');
      renderSongs(favs);
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value;
      if (q) fetchSongs(q);
    }

    window.onload = () => {
      fetchSongs('Top Bollywood Songs');
    };
  </script>
</body>
</html>
